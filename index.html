<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Reneu - Fixed-Page NET Bible & Scholarly Canvas</title>
    <meta name="description" content="A streamlined Bible reading and reflection canvas for delighting in God's Word and observing how your mind is being renewed day by day." />
    <meta property="og:title" content="Reneu - Fixed-Page NET Bible & Scholarly Canvas" />
    <meta property="og:description" content="A streamlined Bible reading and reflection canvas for delighting in God's Word and observing how your mind is being renewed day by day." />
    <meta name="theme-color" content="#f5efeb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reneu" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Offline Font Preloads for Immediate Zero-Latency Rendering -->
    <link rel="preload" href="/fonts/literata-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-normal.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Google Fonts for Scholarly Typography (Fallback / Online CDN) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Instant Pre-render Theme Application for Persistent Splash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('scripturepage_theme');
          if (!theme) {
            var appStr = localStorage.getItem('scripturepage_appearance');
            if (appStr) {
              theme = JSON.parse(appStr).theme;
            }
          }
          var resolved = (theme === 'black' || theme === 'white' || theme === 'parchment')
            ? theme
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'black' : 'parchment');
          var bgColor = resolved === 'black' ? '#111113' : resolved === 'white' ? '#ffffff' : '#f5efeb';

          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.backgroundColor = bgColor;
          if (resolved === 'black') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', bgColor);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Instant Persistent Splash Screen Styles (Adapting to User's Configured Color Theme) -->
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f5efeb;
        color: #1c1917;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        opacity: 1;
        will-change: opacity;
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        contain: layout style paint;
        transition: opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      #pwa-splash::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

      /* Deactivate scrollbars on page while splash screen is active */
      html.splash-active,
      body.splash-active {
        overflow: hidden !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      html.splash-active::-webkit-scrollbar,
      body.splash-active::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

      #pwa-splash.splash-dismissed {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-splash {
          transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-progress-bar {
          animation: none !important;
          transform: translate3d(0, 0, 0) scaleX(1) !important;
          opacity: 0.35 !important;
        }
      }

      /* Parchment Theme (Default) */
      [data-theme="parchment"] #pwa-splash,
      #pwa-splash[data-splash-theme="parchment"] {
        background-color: #f5efeb;
        color: #1c1917;
      }
      [data-theme="parchment"] #pwa-splash .splash-progress-track,
      #pwa-splash[data-splash-theme="parchment"] .splash-progress-track {
        background: rgba(28, 25, 23, 0.12);
      }

      /* White Theme */
      [data-theme="white"] #pwa-splash,
      #pwa-splash[data-splash-theme="white"] {
        background-color: #ffffff;
        color: #111827;
      }
      [data-theme="white"] #pwa-splash .splash-progress-track,
      #pwa-splash[data-splash-theme="white"] .splash-progress-track {
        background: rgba(17, 24, 39, 0.1);
      }

      /* Black Theme */
      [data-theme="black"] #pwa-splash,
      .dark #pwa-splash,
      #pwa-splash[data-splash-theme="black"] {
        background-color: #111113;
        color: #f5f5f7;
      }
      [data-theme="black"] #pwa-splash .splash-progress-track,
      .dark #pwa-splash .splash-progress-track,
      #pwa-splash[data-splash-theme="black"] .splash-progress-track {
        background: rgba(255, 255, 255, 0.16);
      }

      .splash-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }
      .splash-icon {
        width: 52px;
        height: 52px;
        margin-bottom: 1.25rem;
        color: currentColor;
        opacity: 0.85;
      }
      .splash-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 1.625rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        line-height: 1.2;
        margin-bottom: 0.35rem;
      }
      .splash-tagline {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 0.8125rem;
        font-weight: 400;
        opacity: 0.6;
        letter-spacing: 0.02em;
        margin-bottom: 2rem;
      }
      .splash-progress-track {
        width: 120px;
        height: 2.5px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .splash-progress-bar {
        position: absolute;
        inset: 0;
        width: 100%;
        background-color: currentColor;
        opacity: 0.75;
        border-radius: 9999px;
        transform-origin: left center;
        will-change: transform;
        animation: splash-indeterminate 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes splash-indeterminate {
        0% { transform: translate3d(-40%, 0, 0) scaleX(0.35); }
        50% { transform: translate3d(25%, 0, 0) scaleX(0.5); }
        100% { transform: translate3d(105%, 0, 0) scaleX(0.35); }
      }
    </style>
  </head>
  <body class="antialiased splash-active">
    <!-- Instant Persistent Splash Screen for PWA Launch & Slow Connection -->
    <div id="pwa-splash" aria-hidden="true">
      <script>
        (function() {
          try {
            var t = localStorage.getItem('scripturepage_theme') || document.documentElement.getAttribute('data-theme');
            if (t) {
              var s = document.getElementById('pwa-splash');
              if (s) s.setAttribute('data-splash-theme', t);
            }
          } catch(e) {}
        })();
      </script>
      <div class="splash-box">
        <svg class="splash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
        </svg>
        <div class="splash-title">Reneu</div>
        <div class="splash-tagline">Renewing the mind day by day</div>
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Unified, visibility-aware splash controller: prevents strobe/blinks on cold-start and wake
      (function() {
        var splash = document.getElementById('pwa-splash');
        var state = 'active'; // 'active' | 'pending-visible' | 'dismissing' | 'dismissed'
        var fallbackCleanupTimer = null;
        var maxWaitTimer = null;

        function cleanupSplashActive() {
          document.body.classList.remove('splash-active');
          document.documentElement.classList.remove('splash-active');
        }

        if (!splash) {
          cleanupSplashActive();
          window.__reneuDismissSplash = function() { cleanupSplashActive(); };
          return;
        }

        function finalizeRemoval() {
          if (state === 'dismissed') return;
          state = 'dismissed';
          if (fallbackCleanupTimer) {
            clearTimeout(fallbackCleanupTimer);
            fallbackCleanupTimer = null;
          }
          if (maxWaitTimer) {
            clearTimeout(maxWaitTimer);
            maxWaitTimer = null;
          }
          cleanupSplashActive();
          var el = document.getElementById('pwa-splash');
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }

        function startFadeOut() {
          var el = document.getElementById('pwa-splash');
          if (!el || state === 'dismissing' || state === 'dismissed') return;
          state = 'dismissing';

          var onTransitionEnd = function(e) {
            if (e && e.target !== el) return;
            if (e && e.propertyName && e.propertyName !== 'opacity') return;
            el.removeEventListener('transitionend', onTransitionEnd);
            finalizeRemoval();
          };
          el.addEventListener('transitionend', onTransitionEnd);

          // Wait two frames so opacity:1 and ready content underneath are composited cleanly before fade
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              if (state !== 'dismissing') return;
              if (document.visibilityState === 'hidden') {
                // Tab went hidden before transition started; wait until visible again
                state = 'pending-visible';
                el.removeEventListener('transitionend', onTransitionEnd);
                waitUntilVisibleAndFade();
                return;
              }
              el.classList.add('splash-dismissed');
              // Safety fallback longer than CSS transition (380ms) in case transitionend doesn't fire
              fallbackCleanupTimer = setTimeout(finalizeRemoval, 520);
            });
          });
        }

        function waitUntilVisibleAndFade() {
          if (document.visibilityState === 'visible') {
            startFadeOut();
            return;
          }
          var onVisible = function() {
            if (document.visibilityState === 'visible') {
              document.removeEventListener('visibilitychange', onVisible);
              window.removeEventListener('pageshow', onVisible);
              if (state === 'pending-visible') {
                startFadeOut();
              }
            }
          };
          document.addEventListener('visibilitychange', onVisible);
          window.addEventListener('pageshow', onVisible);
        }

        function dismissSplash() {
          var el = document.getElementById('pwa-splash');
          if (!el) {
            finalizeRemoval();
            return;
          }
          if (state === 'dismissing' || state === 'dismissed' || state === 'pending-visible') {
            return;
          }
          if (document.visibilityState === 'hidden') {
            state = 'pending-visible';
            waitUntilVisibleAndFade();
            return;
          }
          startFadeOut();
        }

        window.__reneuDismissSplash = dismissSplash;

        // If restored from bfcache or woken after splash was already dismissed/dismissing, ensure clean state
        window.addEventListener('pageshow', function(e) {
          var el = document.getElementById('pwa-splash');
          if (!el) {
            cleanupSplashActive();
            return;
          }
          if (e && e.persisted && (state === 'dismissed' || el.classList.contains('splash-dismissed'))) {
            finalizeRemoval();
          }
        });

        // Allow clicking the splash screen to dismiss at any time
        splash.addEventListener('click', function() {
          dismissSplash();
        });

        // 4.5s maximum safeguard (only fires while page is visible, avoiding post-hibernation instant snap)
        if (window.location.search.indexOf('splash=') === -1) {
          var scheduleMaxWait = function() {
            if (maxWaitTimer) clearTimeout(maxWaitTimer);
            maxWaitTimer = setTimeout(function() {
              if (document.visibilityState === 'visible') {
                dismissSplash();
              } else {
                var onResume = function() {
                  if (document.visibilityState === 'visible') {
                    document.removeEventListener('visibilitychange', onResume);
                    dismissSplash();
                  }
                };
                document.addEventListener('visibilitychange', onResume);
              }
            }, 4500);
          };
          scheduleMaxWait();
        }
      })();
    </script>
  </body>
</html>
